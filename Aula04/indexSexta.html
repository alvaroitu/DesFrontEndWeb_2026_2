<hr>
    <form action="/cadastro" method="post">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome">

        <fieldset>
            <legend>Turno</legend>
            <input type="radio" id="m" name="turno" value="manha">
            <label for="m">Manha</label>
            <input type="radio" id="n" name="turno" value="noite" checked>
            <label for="n">Noite</label>
        </fieldset>

        <fieldset>
            <legend>Interesses</legend>
            <input type="checkbox" id="a" name="int" value="html">
            <label for="a">HTML</label>
            <input type="checkbox" id="b" name="int" value="css">
            <label for="b">CSS</label>
        </fieldset>

        <button type="submit">Cadastrar</button>

    </form>




<h1>Inscricao no evento</h1>

<form action="/inscricao" method="post">

  <fieldset>
    <legend>Dados pessoais</legend>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome"
           maxlength="80" required autocomplete="name">

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email"
           required autocomplete="email">

    <label for="idade">Idade</label>
    <input type="number" id="idade" name="idade"
           min="16" max="99" step="1" required>

    <label for="nasc">Data de nascimento</label>
    <input type="date" id="nasc" name="nasc"
           min="1920-01-01" max="2010-12-31" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha"
           minlength="8" required autocomplete="new-password">
  </fieldset>

  <fieldset>
    <legend>Curso e observacoes</legend>

    <label for="curso">Curso</label>
    <select id="curso" name="curso" required>
      <option value="">Selecione...</option>
      <option value="ads">Analise e Desenvolvimento de Sistemas</option>
      <option value="eng">Engenharia de Software</option>
      <option value="cc">Ciencia da Computacao</option>
    </select>

    <label for="obs">Observacoes</label>
    <textarea id="obs" name="obs" rows="4" maxlength="500"
              placeholder="Ate 500 caracteres"></textarea>
  </fieldset>

  <button type="submit">Enviar inscricao</button>
  <button type="reset">Limpar</button>

</form>




</body>
</html>
